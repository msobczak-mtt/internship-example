spring.application.name=app-vod

spring.messages.basename=messages

management.endpoints.web.exposure.include=*

management.endpoint.env.show-values=always

management.info.java.enabled=true
management.info.os.enabled=true
management.info.build.enabled=true

management.endpoint.shutdown.access=unrestricted

vod.opening=9
vod.dao=jpa

spring.mvc.view.prefix=/templates/
spring.mvc.view.suffix=.html

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/vod
spring.datasource.username=root
spring.datasource.password=mysql

spring.jpa.show-sql=true

# Kafka
spring.kafka.consumer.bootstrap-servers=localhost:8097
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=vod.service.RatingListener.RatingEvent

